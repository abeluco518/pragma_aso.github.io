  <meta name="keywords" content="Molins de Rei, associacio, psicologia, salut mental, pragma, contacte" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Anton&&family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <script type="module" crossorigin src="./assets/main-DvuiL8eU.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-BhI7DUGo.css">
</head>

<body class="page-contacte">
  <header class="header">
    <div class="header__container">
      <a href="index.html" class="header__logo"><img src="./assets/IMAGOTIP%201-DVszklrc.png" alt="logo" width="100" /></a>
      <button id="menu" aria-label="Obrir menu">
        <img src="./assets/togleMenu-DnO-1wSC.png" alt="" width="30" />
      </button>
    </div>
    <nav class="header__nav">
      <ul class="header__nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="qui-som.html">Qui som</a></li>
        <li><a href="help.html">Com ajudem</a></li>
        <li><a href="donate.html">Donar</a></li>
        <li><a class="active" href="contacte.html">Contacta'ns</a></li>
      </ul>
    </nav>
  </header>

  <footer class="footer">
    <img class="footer__logo" src="./assets/logo_inverted-D4I3tCsy.png" alt="logo">
    <div class="footer__social">
      <a href="https://www.instagram.com/institut_pragma/"><img src="./assets/instagram-7b9PKUq1.png" alt="instagram"></a>
      <a href="https://www.facebook.com/InstitutPragma/"><img src="./assets/facebook-D_bjJDCx.png" alt="Facebook"></a>
    </div>
  </footer>

  <main>
    <section class="contact-page">
      <div class="contact-page__intro">
        <h1 class="contact-page__title">Contacta'ns</h1>
        <p class="contact-page__text">
          Escriu-nos si vols demanar informació, col·laborar amb l'associació o saber quin suport podem oferir.
        </p>

        <div class="contact-page__details">
          <div class="contact-page__detail">
            <img src="./assets/mail-CoTVKf5L.png" alt="" width="25">
            <a href="mailto:info@institutpragma.com?subject=Informacio%20Associacio%20Pragma">info@institutpragma.com</a>
          </div>
          <div class="contact-page__detail">
            <img src="./assets/telephone-CKTxurO6.png" alt="" width="25">
            <a href="tel:+34936689974">93 668 99 74</a>
          </div>
          <div class="contact-page__detail">
            <img src="./assets/location-BAI0oWBL.png" alt="" width="25">
            <a href="https://maps.app.goo.gl/RiWKrGGspUAumBab6">Passeig del Terraplè, 40, 08750 Molins de Rei</a>
          </div>
        </div>
      </div>

      <form class="contact-form" action="https://formsubmit.co/info@institutpragma.com" method="POST">
        <input type="hidden" name="_subject" value="Nova peticio des de Associacio Pragma">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://www.associaciopragma.com/contacte.html?enviat=1">
        <div class="contact-form__field">
          <label for="name">Nom i cognoms</label>
          <input id="name" name="Nom" type="text" autocomplete="name" required>
        </div>

        <div class="contact-form__field">
          <label for="email">Correu electrònic</label>
          <input id="email" name="Email" type="email" autocomplete="email" required>
        </div>

        <div class="contact-form__field">
          <label for="phone">Telèfon</label>
          <input id="phone" name="Telefon" type="tel" autocomplete="tel">
        </div>

        <div class="contact-form__field">
          <label for="reason">Motiu del contacte</label>
          <select id="reason" name="Motiu" required>
            <option value="">Selecciona una opció</option>
            <option value="Sol·licitar ajuda">Sol·licitar ajuda</option>
            <option value="Fer una donacio">Fer una donació</option>
            <option value="Col·laborar">Col·laborar</option>
            <option value="Informacio general">Informació general</option>
          </select>
        </div>

        <div class="contact-form__field contact-form__field--full">
          <label for="message">Missatge</label>
          <textarea id="message" name="Missatge" rows="6" required></textarea>
        </div>

        <button class="contact-form__submit cta" type="submit">Enviar missatge</button>
      </form>
    </section>
  </main>

</body>

</html>
